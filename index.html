<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? | 점심 메뉴 추천</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #4ecdc4;
            --dark-color: #2d3436;
            --light-color: #f7f9fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--light-color);
            color: var(--dark-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: var(--dark-color);
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #7f8c8d;
            margin-bottom: 1.5rem;
        }

        /* 카테고리 필터 버튼 */
        .category-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .cat-btn {
            border: 1px solid #e0e0e0;
            background: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-btn.active {
            background: var(--dark-color);
            color: white;
            border-color: var(--dark-color);
        }

        /* 메뉴 결과 디스플레이 */
        .result-box {
            background: #fff5f5;
            border: 2px dashed var(--primary-color);
            border-radius: 15px;
            padding: 2.5rem 1rem;
            margin-bottom: 1.5rem;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .menu-category {
            font-size: 0.85rem;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .menu-name {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--dark-color);
            word-break: keep-all;
        }

        /* 메인 추천 버튼 */
        .pick-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            background: var(--primary-color);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            transition: transform 0.1s, background 0.2s;
        }

        .pick-btn:hover {
            background: #ee5253;
        }

        .pick-btn:active {
            transform: scale(0.98);
        }

        /* 메뉴 직접 추가 영역 */
        .add-box {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
            display: flex;
            gap: 8px;
        }

        .add-box input, .add-box select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .add-box input[type="text"] {
            flex: 1;
        }

        .add-btn {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #3bb7b0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍱 오늘 뭐 먹지?</h1>
        <p class="subtitle">점심 메뉴 고민, 버튼 하나로 해결하세요!</p>

        <!-- 카테고리 필터 -->
        <div class="category-group">
            <button class="cat-btn active" onclick="setCategory('전체', this)">전체</button>
            <button class="cat-btn" onclick="setCategory('한식', this)">한식</button>
            <button class="cat-btn" onclick="setCategory('중식', this)">중식</button>
            <button class="cat-btn" onclick="setCategory('일식', this)">일식</button>
            <button class="cat-btn" onclick="setCategory('양식/기타', this)">양식/기타</button>
        </div>

        <!-- 결과 표시 상자 -->
        <div class="result-box">
            <div class="menu-category" id="menu-cat">READY</div>
            <div class="menu-name" id="menu-name">버튼을 눌러주세요!</div>
        </div>

        <!-- 추천 버튼 -->
        <button class="pick-btn" onclick="pickRandomMenu()">🎲 점심 메뉴 추천받기</button>

        <!-- 메뉴 추가 기능 -->
        <div class="add-box">
            <select id="new-cat">
                <option value="한식">한식</option>
                <option value="중식">중식</option>
                <option value="일식">일식</option>
                <option value="양식/기타">양식/기타</option>
            </select>
            <input type="text" id="new-name" placeholder="새 메뉴 이름 (예: 부대찌개)">
            <button class="add-btn" onclick="addMenu()">추가</button>
        </div>
    </div>

    <script>
        // 기본 점심 메뉴 데이터베이스
        let menuList = [
            { category: '한식', name: '김치찌개' },
            { category: '한식', name: '된장찌개' },
            { category: '한식', name: '제육볶음' },
            { category: '한식', name: '비빔밥' },
            { category: '한식', name: '국밥' },
            { category: '중식', name: '짜장면' },
            { category: '중식', name: '짬뽕' },
            { category: '중식', name: '볶음밥' },
            { category: '중식', name: '마라탕' },
            { category: '일식', name: '돈까스' },
            { category: '일식', name: '라멘' },
            { category: '일식', name: '초밥' },
            { category: '일식', name: '우동' },
            { category: '양식/기타', name: '파스타' },
            { category: '양식/기타', name: '햄버거' },
            { category: '양식/기타', name: '샌드위치' },
            { category: '양식/기타', name: '쌀국수' }
        ];

        let selectedCategory = '전체';
        let isSpinning = false;

        // 카테고리 변경 함수
        function setCategory(category, btnElement) {
            selectedCategory = category;
            
            // 모든 버튼에서 active 클래스 제거 후 클릭한 버튼에만 추가
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        // 랜덤 메뉴 추첨 (슬롯머신 모션 효과 포함)
        function pickRandomMenu() {
            if (isSpinning) return;

            // 현재 카테고리에 맞는 메뉴만 필터링
            const filteredMenu = selectedCategory === '전체' 
                ? menuList 
                : menuList.filter(item => item.category === selectedCategory);

            if (filteredMenu.length === 0) {
                alert('해당 카테고리에 등록된 메뉴가 없습니다.');
                return;
            }

            isSpinning = true;
            const catDisplay = document.getElementById('menu-cat');
            const nameDisplay = document.getElementById('menu-name');
            
            let count = 0;
            const maxCount = 15; // 롤링 횟수
            
            // 0.05초마다 무작위 메뉴를 빠르게 보여주는 애니메이션 효과
            const spinner = setInterval(() => {
                const tempIndex = Math.floor(Math.random() * filteredMenu.length);
                catDisplay.innerText = filteredMenu[tempIndex].category;
                nameDisplay.innerText = filteredMenu[tempIndex].name;
                count++;

                if (count >= maxCount) {
                    clearInterval(spinner);
                    // 최종 메뉴 결정
                    const finalMenu = filteredMenu[Math.floor(Math.random() * filteredMenu.length)];
                    catDisplay.innerText = finalMenu.category;
                    nameDisplay.innerText = finalMenu.name;
                    isSpinning = false;
                }
            }, 50);
        }

        // 나만의 메뉴 추가 함수
        function addMenu() {
            const catInput = document.getElementById('new-cat').value;
            const nameInput = document.getElementById('new-name').value.trim();

            if (!nameInput) {
                alert('메뉴 이름을 입력해주세요!');
                return;
            }

            menuList.push({ category: catInput, name: nameInput });
            alert(`'${nameInput}' (이)가 목록에 추가되었습니다!`);
            document.getElementById('new-name').value = '';
        }
    </script>
</body>
</html>
